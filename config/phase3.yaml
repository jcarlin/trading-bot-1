# Trading Bot Phase 3 - Multi-Strategy & Intelligence

# Primary exchange: Hyperliquid
exchange:
  primary: hyperliquid
  hyperliquid:
    testnet: true
    account_address: "${HL_ACCOUNT_ADDRESS}"
    private_key: "${HL_PRIVATE_KEY}"
    rate_limit_rpm: 1200
  fallback: ccxt
  ccxt:
    name: binance
    sandbox: true
    api_key: "${EXCHANGE_API_KEY}"
    api_secret: "${EXCHANGE_API_SECRET}"

# Trading symbols
symbols:
  - BTC/USDC

# Strategy runner config - multi-strategy mode
strategy_runner:
  enabled: true
  mode: multi
  strategy: funding_rate_arb  # fallback for single mode
  symbol: BTC/USDC
  tick_interval_s: 60
  funding_lookback_hours: 72
  candle_lookback: 100
  candle_timeframe: 1h
  log_hold_every_n: 10
  strategies:
    - name: funding_rate_arb
      symbol: BTC/USDC
    - name: momentum_trend
      symbol: BTC/USDC
    - name: mean_reversion
      symbol: BTC/USDC

# Strategy parameters
strategies:
  funding_rate_arb:
    entry_threshold: 0.0001
    exit_threshold: 0.00005
    max_hold_periods: 24
    position_size_pct: 0.03
    min_open_interest: 1000000
    cooldown_periods: 2
  momentum_trend:
    ema_fast: 12
    ema_slow: 26
    rsi_period: 14
    adx_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    adx_threshold: 25
    position_size_pct: 0.02
  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_entry_low: 30
    rsi_entry_high: 70
    position_size_pct: 0.02
    regime_filter: true

# Execution risk controls (hard limits)
execution_risk:
  max_position_pct_per_asset: 0.05
  max_portfolio_exposure_pct: 1.50
  max_strategy_drawdown_pct: 0.05
  max_portfolio_drawdown_pct: 0.15
  max_single_trade_loss_pct: 0.01
  min_cash_reserve_pct: 0.20

# Risk settings
risk:
  position_sizing: percent_equity
  max_position_pct: 0.03
  max_drawdown_pct: 0.20
  commission_pct: 0.001

# Performance tracking
performance:
  update_interval_s: 300
  windows: [1, 4, 24, 168, 720]

# =====================================================================
# Phase 2: Self-Evaluation Loop
# =====================================================================

# Evaluation scheduler intervals (seconds)
evaluation:
  enabled: true
  hourly_interval: 3600
  daily_interval: 86400
  weekly_interval: 604800
  monthly_interval: 2592000

# Strategy health scoring
health_scoring:
  weights:
    sharpe: 0.25
    sortino: 0.15
    max_drawdown: 0.20
    win_rate: 0.15
    profit_factor: 0.15
    calmar: 0.10
  pause_threshold: 20
  drawdown_pause_threshold: 5.0

# Market regime classification
regime_classification:
  sma_fast_period: 20
  sma_slow_period: 50
  atr_period: 14
  volatility_threshold: 2.0

# Backtest comparison
backtest_comparison:
  enabled: true
  lookback_hours: 168
  decay_pause_threshold: 50.0

# OODA orchestrator
orchestrator:
  symbol: BTC/USDC
  strategy_name: funding_rate_arb
  decay_pause_threshold: 50.0
  health_pause_threshold: 20
  # Multi-strategy thresholds
  correlation_limit: 0.8
  portfolio_dd_limit: 15.0

# =====================================================================
# Phase 3: Multi-Strategy & Intelligence
# =====================================================================

# Portfolio metrics
portfolio:
  correlation_window_hours: 168
  benchmark_symbols:
    - BTC/USDC
    - ETH/USDC

# Wallet intelligence
wallet_intelligence:
  enabled: true
  discovery_interval_s: 3600
  min_score_threshold: 60.0
  max_wallets: 50
  analysis_depth: standard

# Data ingestion settings
ingestion:
  orderbook:
    enabled: true
    snapshot_interval_s: 5
    depth_levels: 5
  trades:
    enabled: true
  funding:
    enabled: true
    poll_interval_s: 60
  candles:
    enabled: true
    timeframes:
      - 1m
      - 5m
      - 15m
      - 1h
      - 4h
    backfill_on_start: true

# Storage configuration
storage:
  timescaledb:
    host: "${POSTGRES_HOST:-localhost}"
    port: 5432
    dbname: "${POSTGRES_DB:-trading}"
    user: "${POSTGRES_USER:-trading}"
    password: "${POSTGRES_PASSWORD:-trading}"
  redis:
    host: "${REDIS_HOST:-localhost}"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD:-}"

# Monitoring
monitoring:
  metrics_port: 8001
  strategy_metrics_port: 8004
  health_check_interval_s: 30

# Reconciliation
reconciliation:
  interval_s: 30
  auto_correct: false

# Logging
logging:
  level: INFO
  file: strategy_runner.log
  format: json
